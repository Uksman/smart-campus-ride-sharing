<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#143c34">
    <title>You're offline · CampusRide</title>
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f8f8f3; color: #26382e; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
      main { width: min(100%, 440px); padding: 36px; border: 1px solid #e5e9e1; border-radius: 16px; background: #fff; box-shadow: 0 16px 50px #193d2b12; text-align: center; }
      img { width: 56px; height: 56px; margin-bottom: 20px; border-radius: 15px; }
      p { margin: 0 0 9px; color: #6d9278; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
      h1 { margin: 0 0 12px; font-size: clamp(26px, 8vw, 34px); letter-spacing: -1px; }
      .message { margin: 0 auto 24px; color: #78847b; font-size: 15px; font-weight: 400; letter-spacing: 0; line-height: 1.6; text-transform: none; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; color: #fff; background: #174335; font-size: 14px; font-weight: 600; cursor: pointer; }
      button:hover { background: #225944; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="">
      <p>CampusRide</p>
      <h1>You're offline</h1>
      <p class="message">Reconnect to sign in, find a ride, or update your trip. Your campus community will be here when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
